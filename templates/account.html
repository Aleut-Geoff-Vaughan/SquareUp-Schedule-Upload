{% extends "base.html" %}
{% block title %}Account - Square Schedule Manager{% endblock %}

{% block content %}
<h1>Account</h1>
<p class="subtle">Signed in as <strong>{{ session.get('username') }}</strong>{% if session.get('is_admin') %} (admin){% endif %}.</p>

<section class="card">
    <h2>Change password</h2>
    <form id="password-form" class="form-col">
        <div class="form-group">
            <label for="current_password">Current password</label>
            <input type="password" id="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New password (min 8 characters)</label>
            <input type="password" id="new_password" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" minlength="8" required>
        </div>
        <button type="submit" class="btn primary">Update password</button>
    </form>
    <div id="password-status" class="status hidden"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('password-status');
    const current = document.getElementById('current_password').value;
    const next = document.getElementById('new_password').value;
    const confirm = document.getElementById('confirm_password').value;
    statusEl.className = 'status';
    if (next !== confirm) {
        statusEl.textContent = 'New passwords do not match.';
        statusEl.className = 'status error';
        return;
    }
    try {
        const res = await fetch('{{ url_for("change_password") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ current_password: current, new_password: next }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
            statusEl.textContent = data.error || 'Failed to change password';
            statusEl.className = 'status error';
            return;
        }
        statusEl.textContent = 'Password changed.';
        statusEl.className = 'status success';
        document.getElementById('password-form').reset();
    } catch (err) {
        statusEl.textContent = 'Failed: ' + err.message;
        statusEl.className = 'status error';
    }
});
</script>
{% endblock %}
